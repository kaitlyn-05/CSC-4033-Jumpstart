
name: Build and deploy Node.js app to Azure Web App - Jumpstart

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install production dependencies
        working-directory: ./server
        run: npm ci --omit=dev

      - name: Upload backend
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: server/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download backend
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0CA62ACD3FE648BE90FCB92CEC6202F2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BF39EDADCDA0452C98C17FD120D06B51 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E84EBA64331E47388509789A7EA1A3E6 }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: Jumpstart
          slot-name: Production
          package: .
